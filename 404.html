<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // JM BLOG</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬤</text></svg>">
  <style>
    .error-container {
      text-align: center;
      margin-top: 15vh;
    }
    .error-code {
      font-size: 8rem;
      color: var(--green);
      text-shadow: 0 0 20px var(--green), 0 0 40px rgba(0, 255, 65, 0.5);
      margin: 0;
      line-height: 1;
    }
    .error-message {
      color: var(--green-dim);
      font-size: 1.2rem;
      margin: 20px 0;
    }
    .error-details {
      color: #ff4040;
      margin: 30px 0;
    }
    .home-link {
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .home-link:hover {
      text-shadow: 0 0 10px var(--green);
    }
  </style>
</head>
<body>
  <div class="right-glow"></div>

  <div class="container">
    <div class="error-container">
      <pre class="error-code">404</pre>
      <p class="error-message">FILE NOT FOUND</p>
      <div class="error-details">
        <p>> ERROR: The requested resource does not exist on this server.</p>
        <p>> SEGFAULT at 0x00000000</p>
      </div>
      <p>
        <a href="/" class="home-link">cd /home</a>
      </p>
    </div>
  </div>

  <div class="status-bar">
    <span>SYSTEM STATUS: ERROR // RESOURCE NOT FOUND</span>
    <div>
      <a href="https://github.com/jmlago">GitHub</a>
      <a href="https://x.com/josemlago">X</a>
    </div>
  </div>

  <script>
    // Keyboard navigation: Backspace or Escape to go home
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' || e.key === 'Escape') {
        e.preventDefault();
        window.location.href = '/';
      }
    });

    function createGlitchBar() {
      if (Math.random() > 0.5) {
        const bar = document.createElement('div');
        bar.className = 'glitch-bar';
        bar.style.top = Math.random() * 100 + '%';
        bar.style.transform = `translateX(${(Math.random() - 0.5) * 30}px) skewX(-2deg)`;
        bar.style.height = (1 + Math.random() * 5) + 'px';
        document.body.appendChild(bar);
        setTimeout(() => bar.remove(), 50 + Math.random() * 100);
      }
    }
    setInterval(createGlitchBar, 300);
  </script>
</body>
</html>
